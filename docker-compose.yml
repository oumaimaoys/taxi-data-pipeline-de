x-airflow: &airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: chicago-airflow:3.1.7
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    S3_ENDPOINT: http://object-storage:9000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          || echo "User already exists, skipping"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8082:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs:latest
    command: ["/data", "--console-enable"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_USERNAME}
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD}
    volumes:
      - ./object-storage:/data
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - object-storage
    env_file: .env
    environment:
      S3_ENDPOINT: http://object-storage:9000
      S3_HOST: object-storage
      S3_PORT: "9000"
      RAW_DATA_PATH: /app/data/raw_data/chicago_taxi_trips_2020_2021.csv
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python3
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
    volumes:
      - ./spark/src:/app/src
      - ./data:/app/data
    working_dir: /app

volumes:
  airflow_db_data: